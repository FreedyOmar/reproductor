<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora · Reproductor de partículas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="stage"></canvas>
  <div class="vignette"></div>

  <!-- Pantalla de inicio (necesaria para que el navegador permita el audio) -->
  <section id="intro" class="intro">
    <div class="intro-card">
      <h1>Aurora<span>.</span></h1>
      <p class="tagline">La música dibuja tus recuerdos con partículas.</p>
    
      <button id="startBtn" class="start-btn">Comenzar</button>
      <p class="hint">
        ¿No aparecen tus archivos? Ábrelo con un servidor local (por ejemplo, Live Server).
      </p>
    </div>
  </section>

  <header class="topbar">
    <div class="logo">Aurora<span>·</span>partículas</div>


  </header>


  <footer class="player">
    <canvas id="spectrum" class="spectrum"></canvas>

    <div class="meta">
      <div id="trackTitle" class="title">Sin música cargada</div>
      <div id="trackSub" class="sub">Coloca tus archivos en la carpeta music/</div>
    </div>

    <div class="seek">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Progreso">
      <span id="dur">0:00</span>
    </div>

    <div class="controls">
      <button id="shuffleBtn" class="icon-btn small" aria-label="Aleatorio">
        <svg viewBox="0 0 24 24"><path d="M3 7h3c4 0 5 10 9 10h6m0 0l-3-3m3 3l-3 3M3 17h3c1.5 0 2.6-1 3.5-2.2M21 7h-6c-1.5 0-2.6.9-3.5 2.1M21 7l-3-3m3 3l-3 3"/></svg>
      </button>
      <button id="prevBtn" class="icon-btn" aria-label="Anterior">
        <svg viewBox="0 0 24 24" class="fill"><path d="M6 6h2v12H6zM9.5 12L18 6v12z"/></svg>
      </button>
      <button id="playBtn" class="play-btn" aria-label="Reproducir / Pausa">
        <svg viewBox="0 0 24 24" class="fill">
          <path class="i-play" d="M8 5v14l11-7z"/>
          <path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/>
        </svg>
      </button>
      <button id="nextBtn" class="icon-btn" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" class="fill"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button id="repeatBtn" class="icon-btn small" aria-label="Repetir" data-mode="0">
        <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 01-3 3H3"/></svg>
      </button>

      <div class="volume">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"/></svg>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
